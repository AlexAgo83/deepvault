name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the optional Playwright job
        required: false
        default: false
        type: boolean

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Anti-zombie migration guard
        run: npm run ci:anti-zombie

      - name: Check frontend suite without E2E or evaluate
        env:
          DEEPVAULT_CHECK_SKIP_E2E: "1"
          DEEPVAULT_CHECK_SKIP_EVALUATE: "1"
        run: npm run check

      - name: Build
        run: npm run build

      - name: Evaluate mock corpus hermetically
        env:
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: npm run evaluate -- --strict --output "${RUNNER_TEMP}/evaluate.json"

      - name: Upload evaluate artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluate-report
          path: ${{ runner.temp }}/evaluate.json
          retention-days: 7

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: worker/requirements.txt

      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt

      - name: Run worker tests
        env:
          PYTHONPATH: .
        run: python -m pytest worker/tests -q

  contracts:
    runs-on: ubuntu-latest
    needs: [frontend, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: worker/requirements.txt

      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt

      - name: Smoke health and config mode over HTTP
        env:
          PYTHONPATH: .
          WORKER_MODE: local
          WORKER_AUTH_ENABLED: "false"
        run: python scripts/worker-contract-smoke.py

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    needs: [frontend, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
